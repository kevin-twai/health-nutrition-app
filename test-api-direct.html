<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>測試 OpenAI Vision API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .log {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
        }
        button {
            padding: 10px 20px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
        input[type="file"] {
            margin: 10px 0;
        }
        .success { color: #059669; }
        .error { color: #dc2626; }
        .info { color: #2563eb; }
    </style>
</head>
<body>
    <h1>🔍 OpenAI Vision API 測試工具</h1>
    
    <div>
        <input type="file" id="fileInput" accept="image/*">
        <button id="testBtn" onclick="testAPI()">測試 API</button>
    </div>
    
    <h2>日誌：</h2>
    <div id="log" class="log"></div>
    
    <script>
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const className = type;
            logDiv.innerHTML += `<div class="${className}">[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }
        
        async function testAPI() {
            const fileInput = document.getElementById('fileInput');
            const testBtn = document.getElementById('testBtn');
            
            if (!fileInput.files || !fileInput.files[0]) {
                log('❌ 請先選擇一張圖片', 'error');
                return;
            }
            
            const file = fileInput.files[0];
            log(`📤 開始測試 API...`, 'info');
            log(`📦 圖片: ${file.name} (${file.size} bytes)`, 'info');
            
            testBtn.disabled = true;
            testBtn.textContent = '測試中...';
            
            try {
                const formData = new FormData();
                formData.append('photo', file);
                formData.append('maxResults', '5');
                formData.append('minConfidence', '0.3');
                formData.append('language', 'zh-TW');
                
                log('🌐 發送請求到後端...', 'info');
                const startTime = Date.now();
                
                const response = await fetch('https://health-nutrition-app-w3zm.onrender.com/api/v1/photo/recognize', {
                    method: 'POST',
                    body: formData
                });
                
                const endTime = Date.now();
                const duration = ((endTime - startTime) / 1000).toFixed(2);
                
                log(`📥 收到回應 (${duration}秒)`, 'info');
                log(`📊 狀態碼: ${response.status}`, response.ok ? 'success' : 'error');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const result = await response.json();
                log('✅ JSON 解析成功', 'success');
                log(`📊 回應結構:`, 'info');
                log(`  - success: ${result.success}`, 'info');
                log(`  - apiUsed: ${result.data?.apiUsed}`, 'info');
                log(`  - recognition: ${result.data?.recognition ? '存在' : '不存在'}`, 'info');
                log(`  - suggestions: ${result.data?.recognition?.suggestions?.length || 0} 個`, 'info');
                
                if (result.data?.apiUsed === 'ChatGPT Vision API') {
                    log('🎯 成功使用 OpenAI Vision API！', 'success');
                    
                    if (result.data.recognition.suggestions && result.data.recognition.suggestions.length > 0) {
                        log(`✅ 識別到 ${result.data.recognition.suggestions.length} 種食材:`, 'success');
                        result.data.recognition.suggestions.forEach((s, i) => {
                            log(`  ${i + 1}. ${s.food.name} (${Math.round(s.confidence * 100)}%)`, 'success');
                        });
                    } else {
                        log('⚠️ 沒有識別到任何食材', 'error');
                    }
                } else {
                    log(`⚠️ 使用的是: ${result.data?.apiUsed}`, 'error');
                    log('❌ 未使用 OpenAI Vision API', 'error');
                }
                
                log('📄 完整回應:', 'info');
                log(JSON.stringify(result, null, 2), 'info');
                
            } catch (error) {
                log(`❌ 錯誤: ${error.message}`, 'error');
                log(`❌ 錯誤堆疊: ${error.stack}`, 'error');
            } finally {
                testBtn.disabled = false;
                testBtn.textContent = '測試 API';
            }
        }
    </script>
</body>
</html>
