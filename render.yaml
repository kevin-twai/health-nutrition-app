services:
  - type: web
    name: health-nutrition-app
    env: node
    plan: free
    buildCommand: |
      npm install
      cd apps/api && npx tsc
    startCommand: node apps/api/src/simple-server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false