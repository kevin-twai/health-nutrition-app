name: 端到端測試

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # 每天凌晨2點執行
    - cron: '0 2 * * *'

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: health_tracker_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      
      mongodb:
        image: mongo:6
        env:
          MONGO_INITDB_ROOT_USERNAME: test
          MONGO_INITDB_ROOT_PASSWORD: test
          MONGO_INITDB_DATABASE: health_tracker_test
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: 檢出代碼
      uses: actions/checkout@v4

    - name: 設定 Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: 安裝依賴
      run: |
        npm ci
        npm run build --workspaces

    - name: 設定測試環境變數
      run: |
        echo "NODE_ENV=test" >> $GITHUB_ENV
        echo "DATABASE_URL=postgresql://test:test@localhost:5432/health_tracker_test" >> $GITHUB_ENV
        echo "REDIS_URL=redis://localhost:6379" >> $GITHUB_ENV
        echo "MONGODB_URL=mongodb://test:test@localhost:27017/health_tracker_test" >> $GITHUB_ENV
        echo "JWT_SECRET=test-secret-key-for-ci" >> $GITHUB_ENV
        echo "OPENAI_API_KEY=test-openai-key" >> $GITHUB_ENV
        echo "GOOGLE_VISION_API_KEY=test-google-vision-key" >> $GITHUB_ENV

    - name: 設定測試資料庫
      run: |
        cd apps/api
        npm run db:migrate:test
        npm run db:seed:test

    - name: 執行後端端到端測試
      run: |
        cd apps/api
        npm run test:e2e

    - name: 執行效能測試
      run: |
        cd apps/api
        npm run test:performance

    - name: 執行安全性測試
      run: |
        cd apps/api
        npm run test:security

    - name: 執行前端端到端測試
      run: |
        cd apps/mobile
        npm run test -- --testPathPattern=e2e --watchAll=false

    - name: 生成測試覆蓋率報告
      run: |
        cd apps/api
        npm run test:coverage

    - name: 上傳測試覆蓋率到 Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./apps/api/coverage/lcov.info
        flags: api
        name: api-coverage

    - name: 上傳測試報告
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-reports-${{ matrix.node-version }}
        path: |
          apps/api/coverage/
          test-reports/
          apps/mobile/coverage/

  load-tests:
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[load-test]')
    
    steps:
    - name: 檢出代碼
      uses: actions/checkout@v4

    - name: 設定 Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 啟動測試環境
      run: |
        docker-compose -f docker-compose.test.yml up -d
        sleep 30

    - name: 安裝 Artillery
      run: npm install -g artillery

    - name: 執行負載測試
      run: |
        artillery run test-configs/load-test.yml --output load-test-report.json

    - name: 生成負載測試報告
      run: |
        artillery report load-test-report.json --output load-test-report.html

    - name: 上傳負載測試報告
      uses: actions/upload-artifact@v3
      with:
        name: load-test-report
        path: |
          load-test-report.json
          load-test-report.html

    - name: 清理測試環境
      if: always()
      run: |
        docker-compose -f docker-compose.test.yml down -v

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: 檢出代碼
      uses: actions/checkout@v4

    - name: 執行 npm audit
      run: |
        npm audit --audit-level moderate
        cd apps/api && npm audit --audit-level moderate
        cd ../mobile && npm audit --audit-level moderate
        cd ../web && npm audit --audit-level moderate

    - name: 執行 Snyk 安全掃描
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high

    - name: 執行 CodeQL 分析
      uses: github/codeql-action/init@v2
      with:
        languages: javascript

    - name: 執行 CodeQL 分析
      uses: github/codeql-action/analyze@v2