name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: health_tracker_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      mongodb:
        image: mongo:6.0
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: password
        ports:
          - 27017:27017
      
      redis:
        image: redis:7
        ports:
          - 6379:6379

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build shared types
      run: npm run build --workspace=@health-tracker/shared-types

    - name: Run linting
      run: npm run lint

    - name: Run type checking
      run: npm run type-check

    - name: Run tests
      run: npm run test
      env:
        NODE_ENV: test
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5432
        POSTGRES_DB: health_tracker_test
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        MONGODB_URI: mongodb://admin:password@localhost:27017/health_tracker_test?authSource=admin
        REDIS_HOST: localhost
        REDIS_PORT: 6379

    - name: Build applications
      run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push API image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./docker/api/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/health-tracker-api:latest
          ${{ secrets.DOCKER_USERNAME }}/health-tracker-api:${{ github.sha }}

    - name: Build and push Web image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./docker/web/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/health-tracker-web:latest
          ${{ secrets.DOCKER_USERNAME }}/health-tracker-web:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Deploy to production
      run: |
        echo "部署到生產環境的步驟將在此實作"
        echo "可以使用 AWS ECS, Kubernetes, 或其他部署平台"