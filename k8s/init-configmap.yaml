apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-config
  namespace: health-nutrition-tracker
data:
  init.sql: |
    -- 建立用戶相關表格
    CREATE TABLE IF NOT EXISTS users (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        email VARCHAR(255) UNIQUE NOT NULL,
        password_hash VARCHAR(255) NOT NULL,
        name VARCHAR(255),
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS user_profiles (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID REFERENCES users(id) ON DELETE CASCADE,
        age INTEGER,
        gender VARCHAR(10),
        height DECIMAL(5,2),
        weight DECIMAL(5,2),
        activity_level VARCHAR(20),
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS health_goals (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID REFERENCES users(id) ON DELETE CASCADE,
        goal_type VARCHAR(50) NOT NULL,
        target_value DECIMAL(10,2),
        current_value DECIMAL(10,2) DEFAULT 0,
        deadline DATE,
        status VARCHAR(20) DEFAULT 'active',
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- 建立索引
    CREATE INDEX IF NOT EXISTS idx_users_email ON users(email);
    CREATE INDEX IF NOT EXISTS idx_user_profiles_user_id ON user_profiles(user_id);
    CREATE INDEX IF NOT EXISTS idx_health_goals_user_id ON health_goals(user_id);
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-init-config
  namespace: health-nutrition-tracker
data:
  init.js: |
    // MongoDB 初始化腳本
    db = db.getSiblingDB('nutrition_data');

    // 建立食物資料集合
    db.createCollection('foods', {
      validator: {
        $jsonSchema: {
          bsonType: "object",
          required: ["name", "nutrition"],
          properties: {
            name: {
              bsonType: "string",
              description: "食物名稱必須是字串"
            },
            category: {
              bsonType: "string",
              description: "食物分類"
            },
            nutrition: {
              bsonType: "object",
              required: ["calories", "protein", "carbohydrates", "fat"],
              properties: {
                calories: { bsonType: "number" },
                protein: { bsonType: "number" },
                carbohydrates: { bsonType: "number" },
                fat: { bsonType: "number" },
                fiber: { bsonType: "number" },
                sugar: { bsonType: "number" },
                sodium: { bsonType: "number" }
              }
            }
          }
        }
      }
    });

    // 建立食物日誌集合
    db.createCollection('food_logs', {
      validator: {
        $jsonSchema: {
          bsonType: "object",
          required: ["userId", "foodId", "portion", "timestamp"],
          properties: {
            userId: { bsonType: "string" },
            foodId: { bsonType: "string" },
            portion: { bsonType: "number" },
            mealType: { bsonType: "string" },
            timestamp: { bsonType: "date" }
          }
        }
      }
    });

    // 建立對話記錄集合
    db.createCollection('conversations', {
      validator: {
        $jsonSchema: {
          bsonType: "object",
          required: ["userId", "messages"],
          properties: {
            userId: { bsonType: "string" },
            messages: {
              bsonType: "array",
              items: {
                bsonType: "object",
                required: ["role", "content", "timestamp"],
                properties: {
                  role: { bsonType: "string" },
                  content: { bsonType: "string" },
                  timestamp: { bsonType: "date" }
                }
              }
            }
          }
        }
      }
    });

    // 建立索引
    db.foods.createIndex({ "name": "text", "category": 1 });
    db.food_logs.createIndex({ "userId": 1, "timestamp": -1 });
    db.conversations.createIndex({ "userId": 1, "updatedAt": -1 });

    // 插入範例資料
    db.foods.insertMany([
      {
        name: "白米飯",
        category: "主食",
        nutrition: {
          calories: 130,
          protein: 2.7,
          carbohydrates: 28,
          fat: 0.3,
          fiber: 0.4,
          sugar: 0.1,
          sodium: 1
        },
        commonPortions: [
          { name: "一碗", weight: 150 },
          { name: "半碗", weight: 75 }
        ]
      },
      {
        name: "雞胸肉",
        category: "蛋白質",
        nutrition: {
          calories: 165,
          protein: 31,
          carbohydrates: 0,
          fat: 3.6,
          fiber: 0,
          sugar: 0,
          sodium: 74
        },
        commonPortions: [
          { name: "一片", weight: 100 },
          { name: "半片", weight: 50 }
        ]
      }
    ]);

    print("MongoDB 初始化完成");