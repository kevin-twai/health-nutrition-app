apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: health-nutrition-tracker
type: Opaque
data:
  # Base64 encoded secrets - replace with actual values
  JWT_SECRET: <BASE64_ENCODED_JWT_SECRET>
  POSTGRES_PASSWORD: <BASE64_ENCODED_POSTGRES_PASSWORD>
  MONGODB_PASSWORD: <BASE64_ENCODED_MONGODB_PASSWORD>
  REDIS_PASSWORD: <BASE64_ENCODED_REDIS_PASSWORD>
  OPENAI_API_KEY: <BASE64_ENCODED_OPENAI_API_KEY>
  GOOGLE_VISION_API_KEY: <BASE64_ENCODED_GOOGLE_VISION_API_KEY>
  AWS_ACCESS_KEY_ID: <BASE64_ENCODED_AWS_ACCESS_KEY_ID>
  AWS_SECRET_ACCESS_KEY: <BASE64_ENCODED_AWS_SECRET_ACCESS_KEY>
  NOTION_API_KEY: <BASE64_ENCODED_NOTION_API_KEY>
  LINE_CHANNEL_SECRET: <BASE64_ENCODED_LINE_CHANNEL_SECRET>
  LINE_CHANNEL_ACCESS_TOKEN: <BASE64_ENCODED_LINE_CHANNEL_ACCESS_TOKEN>
---
apiVersion: v1
kind: Secret
metadata:
  name: db-secrets
  namespace: health-nutrition-tracker
type: Opaque
data:
  postgres-password: <BASE64_ENCODED_POSTGRES_PASSWORD>
  mongodb-password: <BASE64_ENCODED_MONGODB_PASSWORD>
  redis-password: <BASE64_ENCODED_REDIS_PASSWORD>